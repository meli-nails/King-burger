name: Validate and package King Burger

on:
  push:
    branches: [main]
  pull_request:

jobs:
  javascript-syntax-and-package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Validate inline JavaScript
        run: npm test
      - name: Build complete source ZIP
        if: github.event_name == 'push'
        run: zip -r king-burger-complete.zip . -x ".git/*" "node_modules/*"
      - name: Upload complete source ZIP
        if: github.event_name == 'push'
        uses: actions/upload-artifact@v4
        with:
          name: king-burger-complete
          path: king-burger-complete.zip
          if-no-files-found: error
          retention-days: 30
